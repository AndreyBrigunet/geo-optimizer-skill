# Example / dogfooding workflow for the GEO Optimizer GitHub Action.
# Runs a GEO audit on the AgencyPilot site every Monday and on push to main.

name: GEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write # required for SARIF upload

jobs:
  geo-audit:
    name: GEO Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Basic example — audit with JSON output
      - name: Run GEO Audit
        id: geo
        uses: ./
        with:
          url: https://easy4live.com
          min-score: 40
          format: json

      # Show results in job summary
      - name: Print results
        run: |
          echo "## 🎯 GEO Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Score | **${{ steps.geo.outputs.score }}**/100 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Band | \`${{ steps.geo.outputs.band }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Report | \`${{ steps.geo.outputs.report-path }}\` |" >> "$GITHUB_STEP_SUMMARY"

      # Upload report as artifact (skip if audit produced no report)
      - name: Upload report
        if: steps.geo.outputs.report-path != ''
        uses: actions/upload-artifact@v7
        with:
          name: geo-report
          path: ${{ steps.geo.outputs.report-path }}
          retention-days: 30

      - name: Generate detailed Telegram report
        run: |
          geo audit \
            --url https://easy4live.com \
            --format text \
            --output geo-report.txt \
            --cache

      - name: Send detailed report to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCORE: ${{ steps.geo.outputs.score }}
          BAND: ${{ steps.geo.outputs.band }}
        run: |
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          CAPTION=$(printf "🔎 Easy4Live GEO Audit\n\nScore: %s/100\nBand: %s\nSite: https://easy4live.com\n\nRaport GEO complet atașat.\nGitHub: %s" \
            "$SCORE" \
            "$BAND" \
            "$RUN_URL")

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            --form "chat_id=${CHAT_ID}" \
            --form "document=@geo-report.txt" \
            --form "caption=${CAPTION}"

  # SARIF example — visible in GitHub Security tab
  geo-sarif:
    name: GEO Audit (SARIF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run GEO Audit (SARIF)
        uses: ./
        with:
          url: https://easy4live.com
          format: sarif
